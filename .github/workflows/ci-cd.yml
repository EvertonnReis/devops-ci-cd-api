name: CI/CD Pipeline

# Triggers: quando este workflow será executado
on:
  # Quando há push em qualquer branch
  push:
    branches: [ main, develop, feature/* ]
  
  # Quando há pull request para main ou develop
  pull_request:
    branches: [ main, develop ]
  
  # Execução manual (manual trigger)
  workflow_dispatch:

# Variáveis globais do workflow
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '18'

# Definição dos jobs
jobs:
  # Job 1: Lint e análise de código
  lint:
    name: Lint e Análise
    runs-on: ubuntu-latest
    
    steps:
      # Baixa o código do repositório
      - name: Checkout código
        uses: actions/checkout@v4
      
      # Configura Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      # Instala dependências
      - name: Instalar dependências
        run: npm ci
      
      # Executa linter
      - name: Executar ESLint
        run: npm run lint
        continue-on-error: true

  # Job 2: Testes unitários
  test:
    name: Testes Unitários
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      # Executa testes com coverage
      - name: Executar testes
        run: npm run test
        continue-on-error: true
      
      # Upload coverage para Codecov (opcional)
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # Job 3: Build da imagem Docker
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    
    # Apenas em push para main, develop e PRs
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      # Setup do Docker Buildx para otimização
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      # Login no GitHub Container Registry
      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Gera tags para a imagem
      - name: Extrair metadados
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      
      # Build e Push da imagem
      - name: Build e Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 4: Segurança - Scan de vulnerabilidades
  security:
    name: Segurança - Scan
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      # Audit de dependências
      - name: Audit dependências
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # Job 5: Notificação de sucesso
  notify:
    name: Notificação
    runs-on: ubuntu-latest
    needs: [lint, test, build, security]
    if: always()
    
    steps:
      - name: Status do workflow
        run: |
          echo "✅ Pipeline concluído!"
          echo "Branch: ${{ github.ref }}"
          echo "Evento: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"
